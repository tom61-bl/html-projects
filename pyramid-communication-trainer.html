<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金字塔沟通练习器</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 颜色系统 - 森林绿主题 */
      --color-primary: #2D5A4A;
      --color-primary-light: #4A7A6A;
      --color-primary-dark: #1E3D32;
      --color-accent: #E8A849;
      --color-accent-light: #F5C97A;

      /* 背景色 */
      --bg-main: #F5F2ED;
      --bg-card: #FFFFFF;
      --bg-elevated: #FDFCFA;

      /* 文字色 */
      --text-primary: #1A2B24;
      --text-secondary: #4A5C54;
      --text-muted: #8A9B92;

      /* 边框与分割 */
      --border-light: #E8E4DF;
      --border-medium: #D4CFC8;

      /* 状态色 */
      --color-danger: #D4544A;
      --color-danger-light: #FAE8E7;
      --color-success: #4A9E6A;
      --color-success-light: #E8F5ED;
      --color-warning: #D4A853;
      --color-warning-light: #FDF5E6;

      /* 阴影系统 */
      --shadow-xs: 0 1px 2px rgba(45, 90, 74, 0.04);
      --shadow-sm: 0 2px 8px rgba(45, 90, 74, 0.06);
      --shadow-md: 0 4px 16px rgba(45, 90, 74, 0.08);
      --shadow-lg: 0 8px 32px rgba(45, 90, 74, 0.12);
      --shadow-xl: 0 16px 48px rgba(45, 90, 74, 0.16);

      /* 圆角系统 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-2xl: 32px;

      /* 字体 */
      --font-handwrite: 'Ma Shan Zheng', cursive;
      --font-casual: 'Caveat', cursive;
      --font-body: 'Noto Sans SC', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      background: var(--bg-main);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(74, 122, 106, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(232, 168, 73, 0.06) 0%, transparent 50%);
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ========== Header ========== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: var(--bg-card);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .logo-text {
      font-family: var(--font-handwrite);
      font-size: 32px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      background: var(--bg-main);
      padding: 6px;
      border-radius: var(--radius-xl);
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }

    .tab-btn:hover:not(.active) {
      background: rgba(255,255,255,0.6);
      color: var(--text-primary);
    }

    .progress-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--bg-main);
      border-radius: var(--radius-lg);
    }

    .achievement-btn {
      background: var(--bg-main);
      border: none;
      cursor: pointer;
      font-size: 24px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      transition: all 0.2s;
    }

    .achievement-btn:hover {
      transform: scale(1.15);
      background: var(--bg-card);
    }

    /* ========== Cards ========== */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .card-label {
      font-family: var(--font-casual);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ========== Bento Grid ========== */
    .bento-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .bento-grid { grid-template-columns: 1fr; }
    }

    /* ========== Question Grid ========== */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .question-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
      border-color: var(--color-primary-light);
    }

    .question-card:hover::before {
      opacity: 1;
    }

    .question-card .category {
      font-family: var(--font-casual);
      font-size: 12px;
      color: var(--color-accent);
      letter-spacing: 1px;
      font-weight: 500;
    }

    .question-card .title {
      font-weight: 600;
      margin: 10px 0;
      font-size: 16px;
      color: var(--text-primary);
    }

    .question-card .difficulty {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
    }

    .question-card .difficulty.easy {
      background: var(--color-success-light);
      color: var(--color-success);
    }

    .question-card .difficulty.medium {
      background: var(--color-warning-light);
      color: var(--color-warning);
    }

    .question-card .difficulty.hard {
      background: var(--color-danger-light);
      color: var(--color-danger);
    }

    /* ========== Category Filters ========== */
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filter-btn {
      padding: 8px 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .filter-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
      box-shadow: var(--shadow-sm);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    /* ========== Input ========== */
    textarea {
      background: var(--bg-main);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.8;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      transition: all 0.25s ease;
      min-height: 200px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(45, 90, 74, 0.1);
      background: var(--bg-card);
    }

    .input-card {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .input-card textarea {
      flex: 1;
      min-height: 300px;
    }

    /* ========== Buttons ========== */
    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font-body);
      box-shadow: 0 4px 14px rgba(45, 90, 74, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 90, 74, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-lg);
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }

    .btn-secondary:hover {
      background: var(--color-primary);
      color: white;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    /* ========== Raw Info ========== */
    .raw-info {
      background: var(--bg-main);
      border-radius: var(--radius-lg);
      padding: 24px;
      font-size: 14px;
      line-height: 2;
      white-space: pre-wrap;
      border: 1px solid var(--border-light);
    }

    .raw-info .highlight {
      background: linear-gradient(135deg, rgba(232, 168, 73, 0.3), rgba(232, 168, 73, 0.15));
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* ========== Score Ring ========== */
    .score-overview {
      display: flex;
      align-items: center;
      gap: 48px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .score-ring {
      position: relative;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }

    .score-ring svg {
      transform: rotate(-90deg);
    }

    .score-ring .bg-ring {
      fill: none;
      stroke: var(--border-light);
      stroke-width: 10;
    }

    .score-ring .progress-ring {
      fill: none;
      stroke: url(#scoreGradient);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }

    .score-number {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 36px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .score-details {
      flex: 1;
      min-width: 220px;
    }

    .score-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ========== Dimension Bars ========== */
    .dimension-bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 24px;
    }

    .dimension-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dimension-bar .label {
      width: 100px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      flex-shrink: 0;
    }

    .dimension-bar .bar-container {
      flex: 1;
      height: 10px;
      background: var(--border-light);
      border-radius: 5px;
      overflow: hidden;
    }

    .dimension-bar .bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.6s ease;
    }

    .dimension-bar .bar-fill.pass {
      background: linear-gradient(90deg, var(--color-success), #6BC48E);
    }

    .dimension-bar .bar-fill.fail {
      background: linear-gradient(90deg, var(--color-danger), #E07870);
    }

    .dimension-bar .score {
      width: 40px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
    }

    /* ========== Feedback Items ========== */
    .feedback-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feedback-item {
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .feedback-item.pass {
      background: var(--color-success-light);
      border-left: 4px solid var(--color-success);
    }

    .feedback-item.fail {
      background: var(--color-danger-light);
      border-left: 4px solid var(--color-danger);
    }

    .feedback-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .feedback-item.pass .feedback-icon {
      background: var(--color-success);
      color: white;
    }

    .feedback-item.fail .feedback-icon {
      background: var(--color-danger);
      color: white;
    }

    .feedback-content {
      flex: 1;
    }

    .feedback-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .feedback-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .feedback-suggestion {
      font-size: 14px;
      color: var(--color-primary);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-medium);
      font-weight: 500;
    }

    /* ========== Pyramid Structure ========== */
    .perfect-version {
      margin-top: 32px;
    }

    .pyramid-structure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px;
    }

    .pyramid-level {
      text-align: center;
      padding: 24px 32px;
      border-radius: var(--radius-xl);
      max-width: 100%;
      width: 100%;
      transition: transform 0.3s;
    }

    .pyramid-level:hover {
      transform: scale(1.02);
    }

    .pyramid-level.conclusion {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      color: white;
      box-shadow: var(--shadow-lg);
    }

    .pyramid-level.points {
      background: var(--bg-card);
      border: 2px solid var(--color-primary);
    }

    .pyramid-label {
      font-family: var(--font-casual);
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .pyramid-point {
      margin-top: 16px;
      padding: 16px;
      background: var(--bg-main);
      border-radius: var(--radius-md);
      text-align: left;
    }

    .pyramid-evidence {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========== Badge ========== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: var(--radius-lg);
      font-size: 12px;
      font-weight: 600;
    }

    .badge.gold {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light));
      color: #7A5A14;
    }

    .badge.silver {
      background: linear-gradient(135deg, #9CA3AF, #D1D5DB);
      color: #4B5563;
    }

    .badge.bronze {
      background: linear-gradient(135deg, #CD7F32, #E5A668);
      color: #7C4A1F;
    }

    /* ========== Learning Center ========== */
    .learning-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .principle-card {
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--border-light);
    }

    .principle-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
    }

    .principle-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: white;
    }

    .principle-title {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .principle-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .principle-detail {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
    }

    .principle-card.expanded .principle-detail {
      display: block;
    }

    .example-box {
      background: var(--bg-main);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
    }

    .example-box.bad {
      border-left: 4px solid var(--color-danger);
    }

    .example-box.good {
      border-left: 4px solid var(--color-success);
    }

    .example-label {
      font-family: var(--font-casual);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* ========== Back Button ========== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
    }

    .back-btn:hover {
      background: var(--bg-main);
      color: var(--color-primary);
      border-color: var(--color-primary);
    }

    /* ========== Animations ========== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-up {
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes checkmark {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .feedback-icon.animate {
      animation: checkmark 0.3s ease;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ========== Others ========== */
    .hidden { display: none !important; }

    .scenario-selector { margin-bottom: 20px; }
    .scenario-selector label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 500;
    }
    .scenario-selector select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-family: var(--font-body);
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s;
    }
    .scenario-selector select:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* ========== Achievement ========== */
    .achievement-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px;
      background: var(--bg-main);
      border-radius: var(--radius-xl);
      transition: all 0.3s ease;
    }

    .achievement-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .achievement-card.locked {
      opacity: 0.5;
    }

    .achievement-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: var(--shadow-sm);
    }

    .achievement-info {
      flex: 1;
    }

    .achievement-name {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .achievement-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ========== Comparison ========== */
    .comparison-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .comparison-item {
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .comparison-item.pass {
      background: var(--color-success-light);
      border-left: 4px solid var(--color-success);
    }

    .comparison-item.fail {
      background: var(--color-danger-light);
      border-left: 4px solid var(--color-danger);
    }

    .comparison-item.warn {
      background: var(--color-warning-light);
      border-left: 4px solid var(--color-warning);
    }
  </style>

    // ==================== 分析引擎 ====================
    function analyze(userText, question) {
      const result = {
        score: 0,
        dimensions: {},
        problems: [],
        perfectVersion: question.perfectAnswer
      };

      // 1. 检测结论先行
      const firstSentence = extractFirstSentence(userText);
      const conclusionIndicators = ['因此', '建议', '结论是', '需要', '必须', '提议', '核心是', '总结', '总的来说', '我认为', '我的建议', '我的结论'];
      const backgroundWords = ['因为', '虽然', '首先', '之前', '背景是', '根据', '各位', '领导好', '护士长', '是这样的'];

      let isConclusionFirst = conclusionIndicators.some(w => firstSentence.includes(w)) && !backgroundWords.some(w => firstSentence.includes(w));
      let conclusionScore = isConclusionFirst ? 85 : 40;

      if (firstSentence.length > 80) {
        conclusionScore -= 15;
      }

      result.dimensions['结论先行'] = { score: conclusionScore, pass: conclusionScore >= 60 };
      if (!isConclusionFirst) {
        result.problems.push({
          type: 'conclusion_not_first',
          dimension: '结论先行',
          text: '你的开头更像背景介绍或铺垫，没有直接给出结论',
          suggestion: '建议用「因此」「建议」「核心问题是」等词开头，直接抛出结论'
        });
      }

      // 2. 检测论点独立性(MECE)
      const points = extractPoints(userText);
      let meceScore = 60;

      if (points.length >= 2) {
        const keywordsList = points.map(p => extractKeywords(p));
        let overlapCount = 0;
        let totalPairs = 0;

        for (let i = 0; i < keywordsList.length; i++) {
          for (let j = i + 1; j < keywordsList.length; j++) {
            totalPairs++;
            const intersection = keywordsList[i].filter(k => keywordsList[j].includes(k));
            const union = new Set([...keywordsList[i], ...keywordsList[j]]);
            if (intersection.length / union.size > 0.3) {
              overlapCount++;
            }
          }
        }

        meceScore = Math.max(30, 100 - (overlapCount / Math.max(totalPairs, 1)) * 50);
      }

      result.dimensions['论点独立性'] = { score: meceScore, pass: meceScore >= 55 };
      if (meceScore < 55) {
        result.problems.push({
          type: 'mece_overlap',
          dimension: '论点独立性',
          text: '你的论点之间存在内容交叉或重叠',
          suggestion: '检查各论点是否可以独立说明不同方面，合并重复内容'
        });
      }

      // 3. 检测论据充分性
      let evidenceCount = 0;
      const evidenceIndicators = [/[0-9]+%/, /[0-9]+(人|次|台|个|起|例)/, /数据显示/, /根据.*数据/, /提高了|降低了/, /共计|平均|累计/, /已经|目前|现在/];
      evidenceIndicators.forEach(pattern => {
        if (pattern.test(userText)) evidenceCount++;
      });

      const evidenceScore = Math.min(100, 40 + evidenceCount * 20);
      result.dimensions['论据充分性'] = { score: evidenceScore, pass: evidenceScore >= 60 };

      if (evidenceScore < 60) {
        result.problems.push({
          type: 'missing_evidence',
          dimension: '论据充分性',
          text: '你的表达缺少具体数据或事实支撑',
          suggestion: '添加具体数字（如百分比、人数、时间）、案例或对比数据来支撑论点'
        });
      }

      // 4. 检测逻辑顺序
      const userKeywords = userText.toLowerCase();
      let orderScore = 70;
      const hasNumbering = /第一.*第二.*第三|1.*2.*3|一.*二.*三/.test(userText);
      const hasSequenceWords = /首先.*然后|接着|最后|其次/.test(userText);

      if (!hasNumbering && !hasSequenceWords && points.length > 1) {
        orderScore = 55;
      }

      result.dimensions['逻辑顺序'] = { score: orderScore, pass: orderScore >= 60 };
      if (orderScore < 60) {
        result.problems.push({
          type: 'logical_disorder',
          dimension: '逻辑顺序',
          text: '论点排列缺乏明显的逻辑顺序',
          suggestion: '使用编号（第一、第二、第三）或顺序词（首先、然后、最后）组织论点'
        });
      }

      // 综合评分
      const weights = { '结论先行': 0.30, '论据充分性': 0.30, '论点独立性': 0.25, '逻辑顺序': 0.15 };
      result.score = Math.round(
        result.dimensions['结论先行'].score * weights['结论先行'] +
        result.dimensions['论据充分性'].score * weights['论据充分性'] +
        result.dimensions['论点独立性'].score * weights['论点独立性'] +
        result.dimensions['逻辑顺序'].score * weights['逻辑顺序']
      );

      // 添加通过的维度反馈
      Object.keys(result.dimensions).forEach(dim => {
        if (result.dimensions[dim].pass && !result.problems.find(p => p.dimension === dim)) {
          result.problems.push({
            type: 'pass',
            dimension: dim,
            text: '',
            suggestion: ''
          });
        }
      });

      // 按通过/失败排序
      result.problems.sort((a, b) => {
        if (a.type === 'pass' && b.type !== 'pass') return 1;
        if (a.type !== 'pass' && b.type === 'pass') return -1;
        return 0;
      });

      return result;
    }

    function extractFirstSentence(text) {
      const trimmed = text.trim();
      const match = trimmed.match(/^[^。！？\n]+/);
      return match ? match[0] : trimmed.substring(0, 100);
    }

    function extractPoints(text) {
      const sentences = text.split(/[。！？\n]/).filter(s => s.trim().length > 10);
      return sentences;
    }

    function extractKeywords(text) {
      const stopWords = ['的', '了', '是', '在', '有', '和', '与', '也', '都', '要', '会', '可以', '我们', '这个', '那', '并', '但', '而'];
      const words = text.split(/[，。、；：""''（）【】\s]/).filter(w => w.length >= 2 && !stopWords.includes(w));
      return [...new Set(words)];
    }

    function renderSentenceComparison(analysis, question) {
      // 获取用户输入
      const userInput = document.getElementById('user-input')?.value ||
        (state.currentUserInput || '');

      // 提取句子
      const userSentences = userInput.split(/[。！？\n]/).filter(s => s.trim().length > 5);
      const perfectSentences = [
        analysis.perfectVersion.conclusion,
        ...analysis.perfectVersion.points.map(p => p.title)
      ];

      // 判断每句话的问题
      const conclusionIndicators = ['因此', '建议', '结论是', '需要', '必须', '提议', '核心是', '总结', '总的来说', '我认为', '我的建议', '我的结论'];
      const dataIndicators = [/%/, /[0-9]+(人|次|台|个|起|例|万|千)/, /数据/, /相比/, /增长/, /下降/];
      const orderIndicators = [/第一|第二|第三|首先|然后|接着|最后/];

      let html = '';

      // 结论句对比
      if (userSentences.length > 0) {
        const firstSentence = userSentences[0];
        const isConclusion = conclusionIndicators.some(w => firstSentence.includes(w));
        const isTooLong = firstSentence.length > 80;

        html += `
          <div style="padding: 16px; border-radius: 12px; border-left: 4px solid ${isConclusion && !isTooLong ? 'var(--color-success)' : 'var(--color-danger)'}; background: ${isConclusion && !isTooLong ? 'rgba(90,158,111,0.08)' : 'rgba(212,82,74,0.08)'};">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
              <span style="background: ${isConclusion && !isTooLong ? 'var(--color-success)' : 'var(--color-danger)'}; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px;">
                ${isConclusion && !isTooLong ? '✓ 结论先行' : '✗ 结论未前置'}
              </span>
            </div>
            <div style="font-size: 14px; margin-bottom: 4px;"><strong>你的开头：</strong>${escapeHtml(firstSentence.substring(0, 60))}${firstSentence.length > 60 ? '...' : ''}</div>
            <div style="font-size: 13px; color: var(--color-text-muted);"><strong>完美示范：</strong>${escapeHtml(perfectSentences[0])}</div>
            ${isTooLong ? '<div style="font-size: 12px; color: var(--color-danger); margin-top: 8px;">💡 建议：开头不要太长，控制在60字以内，直接抛出结论</div>' : ''}
            ${!isConclusion ? '<div style="font-size: 12px; color: var(--color-danger); margin-top: 8px;">💡 建议：开头加「因此」「建议」等词，直接给出结论</div>' : ''}
          </div>
        `;
      }

      // 论据对比
      const dataCount = dataIndicators.filter(r => dataIndicators.some(ind => ind.test(userInput))).length;
      const hasNumbering = orderIndicators.some(r => r.test(userInput));

      html += `
        <div style="padding: 16px; border-radius: 12px; border-left: 4px solid ${dataCount >= 2 ? 'var(--color-success)' : 'var(--color-accent)'}; background: ${dataCount >= 2 ? 'rgba(90,158,111,0.08)' : 'rgba(212,168,83,0.08)'};">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <span style="background: ${dataCount >= 2 ? 'var(--color-success)' : 'var(--color-accent)'}; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px;">
              ${dataCount >= 2 ? '✓ 论据充分' : '⚠️ 论据不足'}
            </span>
            <span style="color: var(--color-text-muted); font-size: 12px;">发现 ${dataCount} 处数据支撑</span>
          </div>
          <div style="font-size: 13px; color: var(--color-text-muted);">
            ${dataCount >= 2 ? '你使用了具体数据支撑论点，这是好的做法。' : '建议添加数据（如百分比、对比数字）来支撑论点，让表达更有说服力。'}
          </div>
          <div style="margin-top: 12px; padding: 12px; background: white; border-radius: 8px;">
            <div style="font-size: 12px; color: var(--color-text-muted); margin-bottom: 8px;">参考完美版本的论据写法：</div>
            ${analysis.perfectVersion.points.map((p, i) => `
              <div style="font-size: 13px; margin-bottom: 4px;">
                <strong>论点${i + 1}：</strong>${p.evidence}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // 逻辑顺序
      html += `
        <div style="padding: 16px; border-radius: 12px; border-left: 4px solid ${hasNumbering ? 'var(--color-success)' : 'var(--color-accent)'}; background: ${hasNumbering ? 'rgba(90,158,111,0.08)' : 'rgba(212,168,83,0.08)'};">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <span style="background: ${hasNumbering ? 'var(--color-success)' : 'var(--color-accent)'}; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px;">
              ${hasNumbering ? '✓ 结构清晰' : '⚠️ 建议编号'}
            </span>
          </div>
          <div style="font-size: 13px; color: var(--color-text-muted);">
            ${hasNumbering ? '你使用了编号组织论点，结构清晰。' : '建议使用「第一、第二、第三」或「首先、然后、最后」来组织论点，让逻辑更清晰。'}
          </div>
          <div style="margin-top: 12px; font-size: 13px; color: var(--color-text-muted);">
            建议顺序：<strong>${question.expectedOrder?.join(' → ') || '结论 → 论点1 → 论点2 → ...'}</strong>
          </div>
        </div>
      `;

      // 总结
      html += `
        <div style="padding: 16px; background: var(--color-bg); border-radius: 12px; text-align: center;">
          <div style="font-size: 14px; color: var(--color-text-muted);">
            对比学习：将自己的表达与完美版本逐项对照，找到差距并改进
          </div>
        </div>
      `;

      return html;
    }

      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

                      ${count === 0 ? '优秀' : `${count}次需加强`}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderWrongNotes() {
      const userData = state.userData;
      // 获取薄弱维度的练习历史
      const weakHistory = state.history.filter(h => {
        return Object.values(h.dimensions || {}).some(d => !d.pass);
      }).slice(-20).reverse(); // 最近20条

      // 找出最薄弱的维度
      const weakDims = Object.entries(userData.weakDimensions)
        .filter(([_, count]) => count > 0)
        .sort((a, b) => b[1] - a[1]);

      // 推荐练习（优先同维度题目）
      const recommendedQuestions = [];
      if (weakDims.length > 0) {
        const weakDim = weakDims[0][0];
        // 找到之前做得不好的同类题目
        const weakIds = weakHistory.filter(h => {
          const q = questionBank.find(q => q.id === h.questionId);
          return q && q.tags?.some(tag => tag.includes(weakDim) || tag.includes(weakDims[0][0]));
        }).map(h => h.questionId);

        // 随机推荐未做过的同难度题目
        const available = questionBank.filter(q => {
          const doneIds = state.history.map(h => h.questionId);
          return !doneIds.includes(q.id);
        });
        recommendedQuestions.push(...available.slice(0, 3));
      }

      return `
        <div class="fade-up">
          <button class="back-btn" onclick="navigate('exercise')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回
          </button>

          <div class="card" style="margin-top: 20px;">
            <div class="card-label">专项练习</div>
            <h2 style="font-size: 20px; margin-bottom: 8px;">错题本</h2>
            <p style="color: var(--color-text-muted); font-size: 14px;">针对薄弱维度进行强化练习</p>

            ${weakDims.length > 0 ? `
              <div style="margin-top: 20px; padding: 16px; background: rgba(212,82,74,0.1); border-radius: 12px; border-left: 4px solid var(--color-danger);">
                <div style="font-weight: 500; margin-bottom: 8px;">💪 薄弱维度</div>
                <div style="font-size: 14px; color: var(--color-text-muted);">
                  ${weakDims.slice(0, 2).map(([dim, count]) => `${dim}（${count}次需加强）`).join('、')}等维度需要加强
                </div>
              </div>
            ` : `
              <div style="margin-top: 20px; padding: 16px; background: rgba(90,158,111,0.1); border-radius: 12px; border-left: 4px solid var(--color-success);">
                <div style="font-weight: 500;">🌟 表现优秀！</div>
                <div style="font-size: 14px; color: var(--color-text-muted); margin-top: 8px;">各维度都表现良好，继续保持！</div>
              </div>
            `}
          </div>

          ${recommendedQuestions.length > 0 ? `
            <div class="card" style="margin-top: 20px;">
              <div class="card-label">推荐练习</div>
              <h3 style="font-size: 16px; margin-bottom: 16px;">针对薄弱维度的练习</h3>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${recommendedQuestions.map(q => `
                  <div class="question-card" onclick="navigate('practice', questionBank.find(x => x.id === ${q.id}))" style="display: flex; align-items: center; gap: 16px;">
                    <div style="flex: 1;">
                      <div style="font-size: 12px; color: var(--color-accent);">${q.category}</div>
                      <div style="font-weight: 500; margin: 4px 0;">${q.title}</div>
                      <div style="font-size: 12px; color: var(--color-text-muted);">${q.tags?.join('、') || ''}</div>
                    </div>
                    <div style="text-align: right;">
                      <div class="difficulty ${q.difficulty === 'easy' ? 'easy' : q.difficulty === 'medium' ? 'medium' : 'hard'}" style="font-size: 12px;">
                        ${q.difficulty === 'easy' ? '基础' : q.difficulty === 'medium' ? '进阶' : '挑战'}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="card" style="margin-top: 20px;">
            <div class="card-label">最近练习</div>
            <h3 style="font-size: 16px; margin-bottom: 16px;">${weakHistory.length > 0 ? '需要加强的题目' : '暂无记录'}</h3>
            ${weakHistory.length > 0 ? `
              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${weakHistory.slice(0, 10).map(h => {
                  const q = questionBank.find(q => q.id === h.questionId);
                  if (!q) return '';
                  const failedDims = Object.entries(h.dimensions || {})
                    .filter(([_, d]) => !d.pass)
                    .map(([dim]) => dim);
                  return `
                    <div class="question-card" onclick="navigate('practice', questionBank.find(x => x.id === ${q.id}))" style="display: flex; align-items: center; gap: 16px;">
                      <div style="width: 48px; height: 48px; background: ${h.score >= 90 ? 'var(--color-success)' : h.score >= 60 ? 'var(--color-accent)' : 'var(--color-danger)'}; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                        ${h.score}
                      </div>
                      <div style="flex: 1;">
                        <div style="font-size: 12px; color: var(--color-accent);">${q.category}</div>
                        <div style="font-weight: 500; margin: 4px 0;">${q.title}</div>
                        <div style="font-size: 12px; color: var(--color-danger);">需加强：${failedDims.join('、')}</div>
                      </div>
                      <button class="btn-secondary" style="padding: 8px 16px; font-size: 13px;">再做一次</button>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div style="text-align: center; padding: 40px; color: var(--color-text-muted);">
                <div style="font-size: 48px; margin-bottom: 12px;">📝</div>
                <div>还没有需要加强的题目</div>
                <div style="font-size: 13px; margin-top: 8px;">多练习几道题吧！</div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderFreeformResult(analysis) {
      const circumference = 2 * Math.PI * 50;
      const offset = circumference - (analysis.score / 100) * circumference;

      return `
        <div class="card" style="margin-top: 24px;">
          <div class="card-label">分析结果</div>

          <div class="score-overview">
            <div class="score-ring">
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle class="bg-ring" cx="60" cy="60" r="50"/>
                <circle class="progress-ring" cx="60" cy="60" r="50"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${offset}"/>
              </svg>
              <div class="score-number">${analysis.score}</div>
            </div>

            <div class="score-details">
              <div class="score-label">综合评分</div>
              <div class="score-value">${getScoreText(analysis.score)}</div>

              <div class="dimension-bars">
                ${Object.entries(analysis.dimensions).map(([name, data]) => `
                  <div class="dimension-bar">
                    <span class="label">${name}</span>
                    <div class="bar-container">
                      <div class="bar-fill ${data.pass ? 'pass' : 'fail'}" style="width: ${data.score}%"></div>
                    </div>
                    <span class="score">${data.score}分</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="feedback-list">
            ${analysis.problems.map(p => `
              <div class="feedback-item ${p.type === 'pass' ? 'pass' : 'fail'}">
                <div class="feedback-icon ${p.type === 'pass' ? 'animate' : ''}">
                  ${p.type === 'pass' ? '✓' : '✗'}
                </div>
                <div class="feedback-content">
                  ${p.type !== 'pass' ? `<div class="feedback-title">${p.dimension}</div>` : ''}
                  ${p.type !== 'pass' ? `<div class="feedback-text">${p.text}</div>` : ''}
                  ${p.type !== 'pass' ? `<div class="feedback-suggestion">💡 ${p.suggestion}</div>` : `<div class="feedback-text" style="color: var(--color-success);">✓ 表现良好</div>`}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="btn-group" style="margin-top: 20px;">
            <button class="btn-secondary" onclick="clearFreeformResult()">重新输入</button>
          </div>
        </div>
      `;
    }

    // ==================== 工具函数 ====================
    function highlightKeyData(text) {
      return text.replace(/(\d+[%\人次人台个起例℃])/g, '<span class="highlight">$1</span>');
    }

    function getScoreText(score) {
      if (score >= 90) return '金牌表现！';
      if (score >= 75) return '银牌表现';
      if (score >= 60) return '铜牌表现';
      if (score >= 40) return '继续加油';
      return '需要改进';
    }

    function togglePrinciple(card) {
      card.classList.toggle('expanded');
    }

    // ==================== 导航与事件 ====================
    function navigate(view, data) {
      state.view = view;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });

      const main = document.getElementById('main-content');
      switch(view) {
        case 'exercise':
          main.innerHTML = renderExerciseHome();
          attachExerciseEvents();
          break;
        case 'practice':
          state.currentQuestion = data;
          main.innerHTML = renderPracticePage(data);
          break;
        case 'analysis':
          main.innerHTML = renderAnalysisResult(data.analysis, data.question);
          saveToHistory(data.question.id, data.analysis.score, data.analysis);
          break;
        case 'freeform':
          main.innerHTML = renderMyExpression();
          break;
        case 'learn':
          main.innerHTML = renderLearningCenter();
          break;
        case 'achievements':
          main.innerHTML = renderAchievements();
          break;
        case 'wrongnotes':
          main.innerHTML = renderWrongNotes();
          break;
      }
      updateProgress();
    }

    function attachExerciseEvents() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          state.activeFilter = btn.dataset.category;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.querySelector('.question-grid').outerHTML = `<div class="question-grid">${
            (state.activeFilter === '全部'
              ? questionBank
              : questionBank.filter(q => q.category === state.activeFilter)
            ).map(q => `
              <div class="question-card" data-id="${q.id}">
                <div class="category">${q.category}</div>
                <div class="title">${q.title}</div>
                <div class="difficulty ${q.difficulty === 'easy' ? 'easy' : q.difficulty === 'medium' ? 'medium' : 'hard'}">
                  ${q.difficulty === 'easy' ? '基础' : q.difficulty === 'medium' ? '进阶' : '挑战'}
                </div>
              </div>
            `).join('')
          }</div>`;
          attachExerciseEvents();
        };
      });

      document.querySelectorAll('.question-card').forEach(card => {
        card.onclick = () => {
          const q = questionBank.find(q => q.id === parseInt(card.dataset.id));
          navigate('practice', q);
        };
      });
    }

    function submitPractice() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();

      if (!text) {
        alert('请输入你的表达');
        return;
      }

      if (text.length < 20) {
        alert('表达内容太短，请多写一些');
        return;
      }

      const analysis = analyze(text, state.currentQuestion);
      state.currentUserInput = text; // 保存用于逐句对比
      navigate('analysis', { analysis, question: state.currentQuestion });
    }

    function goToFreeform() {
      const input = document.getElementById('user-input');
      if (input && input.value.trim()) {
        navigate('freeform');
        setTimeout(() => {
          const freeformInput = document.getElementById('freeform-input');
          if (freeformInput) freeformInput.value = input.value.trim();
        }, 100);
      } else {
        navigate('freeform');
      }
    }

    function analyzeFreeform() {
      const input = document.getElementById('freeform-input');
      const text = input.value.trim();
      const scenario = document.getElementById('scenario-select').value;

      if (!text) {
        alert('请输入要分析的内容');
        return;
      }

      if (text.length < 20) {
        alert('内容太短，请多写一些');
        return;
      }

      // 为自由模式创建一个虚拟问题
      const dummyQuestion = {
        perfectAnswer: {
          conclusion: '【系统建议】这是一个基于金字塔原理的优化版本',
          points: [
            { title: '论点一（建议优化）', evidence: '请根据具体内容调整' },
            { title: '论点二（建议优化）', evidence: '请根据具体内容调整' },
            { title: '论点三（建议优化）', evidence: '请根据具体内容调整' }
          ]
        },
        expectedOrder: ['论点1', '论点2', '论点3']
      };

      const analysis = analyze(text, dummyQuestion);

      const resultContainer = document.getElementById('freeform-result');
      resultContainer.innerHTML = renderFreeformResult(analysis);
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function clearFreeformResult() {
      document.getElementById('freeform-input').value = '';
      document.getElementById('freeform-result').innerHTML = '';
    }

    function saveToHistory(questionId, score, analysis) {
      // 更新历史记录
      state.history.push({ questionId, score, dimensions: analysis.dimensions, timestamp: Date.now() });
      localStorage.setItem('pyramid_history', JSON.stringify(state.history));

      // 更新用户数据
      const userData = state.userData;

      // 添加经验值（基于分数）
      const expGained = Math.round(score * 1.5 + 20); // 基础20 + 分数加成
      userData.exp += expGained;

      // 更新等级
      const oldLevel = userData.level;
      const newLevel = calculateLevel(userData.exp);
      userData.level = newLevel.level;

      // 更新Streak
      updateStreak(userData);

      // 记录薄弱维度
      Object.entries(analysis.dimensions).forEach(([dim, data]) => {
        if (!data.pass) {
          userData.weakDimensions[dim] = (userData.weakDimensions[dim] || 0) + 1;
        }
      });

      // 检查成就
      const newAchievements = checkAchievements(userData);

      // 保存用户数据
      saveUserData(userData);
      state.userData = userData;

      // 显示成就弹窗
      if (newAchievements.length > 0) {
        showAchievementPopup(newAchievements, expGained, newLevel.level > oldLevel, newLevel);
      }

      // 显示等级提升
      if (newLevel.level > oldLevel) {
        showLevelUpPopup(newLevel);
      }
    }

    function showAchievementPopup(achievements, expGained, leveledUp, levelInfo) {
      const popup = document.createElement('div');
      popup.style.cssText = `
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: white; border-radius: 20px; padding: 32px; z-index: 1000;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 360px; width: 90%;
        text-align: center; animation: fadeUp 0.3s ease;
      `;

      popup.innerHTML = `
        <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 8px; color: var(--color-primary);">恭喜解锁成就！</div>
        ${achievements.map(a => `
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--color-bg); border-radius: 12px; margin: 8px 0;">
            <span style="font-size: 28px;">${a.icon}</span>
            <div style="text-align: left;">
              <div style="font-weight: 500;">${a.name}</div>
              <div style="font-size: 12px; color: var(--color-text-muted);">${a.desc}</div>
            </div>
          </div>
        `).join('')}
        <div style="margin-top: 16px; font-size: 14px; color: var(--color-text-muted);">
          +${expGained} 经验值
        </div>
        <button onclick="this.closest('[style*=\"z-index\"]').remove()" style="
          margin-top: 16px; background: var(--color-primary); color: white;
          border: none; padding: 12px 32px; border-radius: 12px; cursor: pointer;
          font-size: 15px; font-family: var(--font-body);
        ">太棒了！</button>
      `;

      // 添加遮罩
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999;';
      overlay.onclick = () => { popup.remove(); overlay.remove(); };

      document.body.appendChild(overlay);
      document.body.appendChild(popup);
    }

    function showLevelUpPopup(levelInfo) {
      const popup = document.createElement('div');
      popup.style.cssText = `
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
        border-radius: 20px; padding: 40px; z-index: 1000;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 320px; width: 90%;
        text-align: center; animation: fadeUp 0.3s ease; color: white;
      `;

      popup.innerHTML = `
        <div style="font-size: 56px; margin-bottom: 16px;">🚀</div>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">等级提升！</div>
        <div style="font-size: 32px; font-weight: bold; margin: 16px 0;">Lv.${levelInfo.level}</div>
        <div style="font-size: 18px; opacity: 0.9;">${levelInfo.name}</div>
        <button onclick="this.closest('[style*=\"z-index\"]').remove()" style="
          margin-top: 24px; background: white; color: var(--color-primary);
          border: none; padding: 12px 32px; border-radius: 12px; cursor: pointer;
          font-size: 15px; font-weight: 500; font-family: var(--font-body);
        ">继续加油！</button>
      `;

      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 3000);
    }

    function updateProgress() {
      const userData = state.userData;
      const currentLevel = calculateLevel(userData.exp);
      const progress = getExpProgress(userData);

      let html = `<div style="display: flex; align-items: center; gap: 16px;">`;

      // 等级显示
      html += `<div style="display: flex; align-items: center; gap: 6px;">
        <span style="background: var(--color-primary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500;">Lv.${currentLevel.level}</span>
        <span style="font-size: 13px; color: var(--color-text-muted);">${currentLevel.name}</span>
      </div>`;

      // 进度条
      if (progress < 100) {
        html += `<div style="width: 60px; height: 6px; background: var(--color-border); border-radius: 3px; overflow: hidden;">
          <div style="width: ${progress}%; height: 100%; background: var(--color-primary); border-radius: 3px; transition: width 0.3s;"></div>
        </div>`;
      }

      // Streak
      if (userData.streak > 0) {
        html += `<div style="display: flex; align-items: center; gap: 4px; color: var(--color-accent); font-size: 13px;">
          🔥 ${userData.streak}天
        </div>`;
      }

      // 成就数
      if (userData.achievements.length > 0) {
        html += `<div style="display: flex; align-items: center; gap: 4px; color: var(--color-text-muted); font-size: 13px;">
          🏅 ${userData.achievements.length}
        </div>`;
      }

      html += `</div>`;

      document.getElementById('progress-indicator').innerHTML = html;
    }

    // Tab 切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        const view = btn.dataset.view;
        if (view === 'exercise' || view === 'learn' || view === 'wrongnotes') {
          navigate(view);
        } else if (view === 'freeform') {
          navigate('freeform');
        }
      };
    });

    // 快捷键：Ctrl+Enter 提交
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        const userInput = document.getElementById('user-input');
        const freeformInput = document.getElementById('freeform-input');
        if (userInput && document.activeElement === userInput) {
          submitPractice();
        } else if (freeformInput && document.activeElement === freeformInput) {
          analyzeFreeform();
        }
      }
    });

    // 初始化
    navigate('exercise');
    checkAndShowOnboarding();
  </script>
</body>
</html>
